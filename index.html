<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBIN GAME BETA 0.5.0 - EXPANDED EDITION</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        /* --- MAIN MENU UI --- */
        #main-menu {
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid #38bdf8;
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.2);
            animation: fadeIn 0.4s ease-out;
        }

        h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 8px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
            word-wrap: break-word;
        }

        p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }

        .menu-btn-group { display: flex; flex-direction: column; gap: 12px; }

        /* --- GAME CONTAINER --- */
        #game-view {
            display: none;
            width: 100%;
            max-width: 800px;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease-out;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* Top HUD */
        .hud {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            gap: 10px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .hud span { display: flex; align-items: center; gap: 6px; }

        /* Game Arena Canvas */
        #canvas-container {
            position: relative;
            width: 100%;
            height: 320px;
            background: linear-gradient(to bottom, #0f172a 0%, #1e1b4b 50%, #14532d 50%, #064e3b 100%);
            border-radius: 12px;
            border: 2px solid #475569;
            overflow: hidden;
            margin-bottom: 15px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Control Panel Buttons */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 8px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            word-wrap: break-word;
        }

        .btn:hover:not(:disabled) { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 6px 14px rgba(37, 99, 235, 0.4); }
        .btn:disabled { background: #334155; color: #64748b; opacity: 0.6; cursor: not-allowed; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover:not(:disabled) { background: #b91c1c; }
        .btn-warning { background: #d97706; }
        .btn-warning:hover:not(:disabled) { background: #b45309; }
        .btn-secondary { background: #334155; }
        .btn-secondary:hover:not(:disabled) { background: #475569; }

        /* Fixed Log Box Area */
        #log-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            height: 90px;
            overflow-y: auto;
            font-size: 0.85rem;
            text-align: right;
            color: #38bdf8;
            margin-top: 12px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }

        /* Animated Sprites */
        .sprite {
            position: absolute;
            bottom: 50px;
            font-size: 42px;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .hp-bar-outer {
            width: 44px;
            height: 6px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .hp-bar-inner {
            height: 100%;
            background: #22c55e;
            width: 100%;
            transition: width 0.3s ease;
        }

        /* Animation Keyframes */
        .attack-effect { animation: attackAnim 0.3s ease; }
        .hit-effect { animation: hitAnim 0.3s ease; }

        @keyframes attackAnim {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) translateX(-10px); }
            100% { transform: scale(1); }
        }

        @keyframes hitAnim {
            0%, 100% { transform: translateX(0); filter: none; }
            25% { transform: translateX(-8px); filter: drop-shadow(0 0 8px red); }
            75% { transform: translateX(8px); filter: drop-shadow(0 0 8px red); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- ================= MAIN MENU ================= -->
    <div id="main-menu">
        <h1>🏰 MOBIN GAME</h1>
        <p class="subtitle">نسخه ۱۰ مرحله‌ای و بی‌نهایت (BETA 0.5.0)</p>

        <div class="menu-btn-group">
            <button class="btn" onclick="startGameView()">🎮 شروع بازی</button>
            <button class="btn btn-secondary" onclick="alert('📜 راهنما:\n\n1. با خرید و ارتقای سربازها دفاع خود را قوی کنید.\n2. با دکمه جادوی صاعقه به زامبی‌ها شلیک کنید.\n3. در صورت آسیب دیدن قلعه، آن را تعمیر کنید!\n4. مراقب غول زامبی‌ها (Boss) باشید!')">📜 راهنمای بازی</button>
            <button class="btn btn-secondary" onclick="alert('ℹ️ درباره بازی:\nطراحی و توسعه توسط: مبین گرجی‌زاده\nنسخه: Beta 0.5.0')">ℹ️ درباره سازنده</button>
        </div>
    </div>

    <!-- ================= GAME PLAY VIEW ================= -->
    <div id="game-view">
        <div class="card">
            <!-- HUD Status -->
            <div class="hud">
                <span>🎯 مرحله: <span id="lvl-txt" style="color:#38bdf8;">1</span></span>
                <span>💰 سکه: <span id="coin-txt" style="color:#facc15;">25</span></span>
                <span>🏰 قلعه: <span id="castle-hp" style="color:#4ade80;">120</span>/120</span>
                <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="returnToMenu()">🏠 منو</button>
            </div>

            <!-- Visual Canvas Arena -->
            <div id="canvas-container">
                <!-- Castle -->
                <div class="sprite" style="right: 15px; bottom: 45px;" id="castle-sprite">
                    <div class="hp-bar-outer"><div class="hp-bar-inner" id="castle-hp-bar"></div></div>
                    🏰
                </div>

                <!-- Soldiers Container -->
                <div id="soldiers-area" style="position: absolute; right: 90px; bottom: 50px; display: flex; gap: 6px; z-index: 2;"></div>

                <!-- Zombie Sprite -->
                <div class="sprite" id="zombie-sprite" style="left: -80px; bottom: 50px;">
                    <div class="hp-bar-outer"><div class="hp-bar-inner" id="zombie-hp-bar"></div></div>
                    <span id="zombie-icon">🧟</span>
                </div>
            </div>

            <!-- Log Info Area -->
            <div id="log-box">به Mobin Game خوش آمدید! مدافعان خود را آماده نبرد کنید.</div>

            <!-- Control Buttons -->
            <div class="controls">
                <button class="btn" id="btn-buy" onclick="buySoldier()">🪖 خرید سرباز (10💰)</button>
                <button class="btn" id="btn-up" onclick="upgradeSoldiers()">⬆️ ارتقا (<span id="up-cost">15</span>💰)</button>
                <button class="btn btn-warning" id="btn-repair" onclick="repairCastle()">🔧 تعمیر قلعه (15💰)</button>
                <button class="btn btn-warning" id="btn-spell" onclick="castSpell()">⚡ صاعقه (20💰)</button>
                <button class="btn btn-danger" id="btn-fight" onclick="startBattle()" style="grid-column: span 2;">⚔️ شروع نبرد</button>
            </div>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let coins = 25;
        let level = 1;
        let maxCastleHp = 120;
        let castleHp = 120;
        let upgradeLevel = 0;
        let soldiers = [];
        let isFighting = false;
        let activeZombieHp = 0;

        // --- DOM REFERENCES ---
        const coinTxt = document.getElementById('coin-txt');
        const lvlTxt = document.getElementById('lvl-txt');
        const castleHpTxt = document.getElementById('castle-hp');
        const castleHpBar = document.getElementById('castle-hp-bar');
        const logBox = document.getElementById('log-box');
        const soldiersArea = document.getElementById('soldiers-area');
        const zombieSprite = document.getElementById('zombie-sprite');
        const zombieIcon = document.getElementById('zombie-icon');
        const zombieHpBar = document.getElementById('zombie-hp-bar');
        const castleSprite = document.getElementById('castle-sprite');
        const upCostTxt = document.getElementById('up-cost');

        function startGameView() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';
            updateUI();
        }

        function returnToMenu() {
            if (isFighting) {
                if (!confirm("نبرد در جریان است! آیا مطمئن هستید می‌خواهید خارج شوید؟")) return;
            }
            location.reload();
        }

        function log(msg) {
            logBox.innerHTML = `> ${msg}\n` + logBox.innerHTML;
        }

        function updateUI() {
            coinTxt.innerText = coins;
            lvlTxt.innerText = level;
            castleHpTxt.innerText = castleHp;
            castleHpBar.style.width = `${Math.max(0, (castleHp / maxCastleHp) * 100)}%`;

            // Upgrade Costs
            let upCost = upgradeLevel === 0 ? 15 : (upgradeLevel === 1 ? 30 : 60);
            upCostTxt.innerText = upgradeLevel >= 3 ? "MAX" : upCost;

            // Render Soldiers
            soldiersArea.innerHTML = '';
            soldiers.forEach((s) => {
                const sEl = document.createElement('div');
                sEl.className = 'sprite';
                sEl.style.position = 'relative';
                sEl.style.bottom = '0';
                sEl.innerHTML = `
                    <div class="hp-bar-outer"><div class="hp-bar-inner" style="width:${Math.max(0, (s.hp/s.max_hp)*100)}%"></div></div>
                    ${upgradeLevel >= 2 ? '⚔️' : '🪖'}
                `;
                soldiersArea.appendChild(sEl);
            });

            // Button Control Lock
            document.getElementById('btn-buy').disabled = isFighting || coins < 10;
            document.getElementById('btn-up').disabled = isFighting || upgradeLevel >= 3 || coins < upCost || soldiers.length === 0;
            document.getElementById('btn-repair').disabled = isFighting || coins < 15 || castleHp >= maxCastleHp;
            document.getElementById('btn-spell').disabled = !isFighting || coins < 20 || activeZombieHp <= 0;
            document.getElementById('btn-fight').disabled = isFighting;
        }

        function buySoldier() {
            if (coins >= 10) {
                coins -= 10;
                let bonusDmg = upgradeLevel * 10;
                let bonusHp = upgradeLevel * 30;
                soldiers.push({ hp: 100 + bonusHp, max_hp: 100 + bonusHp, damage: 12 + bonusDmg });
                log(`یک سرباز جدید اضافه شد! (تعداد: ${soldiers.length})`);
                updateUI();
            }
        }

        function upgradeSoldiers() {
            let upCost = upgradeLevel === 0 ? 15 : (upgradeLevel === 1 ? 30 : 60);
            if (coins >= upCost && upgradeLevel < 3 && soldiers.length > 0) {
                coins -= upCost;
                upgradeLevel++;
                soldiers.forEach(s => { s.damage += 10; s.max_hp += 30; s.hp += 30; });
                log(`⬆️ سربازان به سطح ${upgradeLevel} ارتقا یافتند!`);
                updateUI();
            }
        }

        function repairCastle() {
            if (coins >= 15 && castleHp < maxCastleHp) {
                coins -= 15;
                castleHp = Math.min(maxCastleHp, castleHp + 50);
                log("🔧 قلعه ۵۰ واحد ترمیم شد!");
                updateUI();
            }
        }

        function castSpell() {
            if (coins >= 20 && isFighting && activeZombieHp > 0) {
                coins -= 20;
                let spellDmg = 80;
                activeZombieHp = Math.max(0, activeZombieHp - spellDmg);
                zombieSprite.classList.add('hit-effect');
                log(`⚡ صاعقه جادویی برخورد کرد! (${spellDmg} آسیب به زامبی)`);
                setTimeout(() => zombieSprite.classList.remove('hit-effect'), 300);
                updateUI();
            }
        }

        async function startBattle() {
            isFighting = true;
            updateUI();

            let totalZombies = 4 + (level * 2);
            log(`⚔️ نبرد مرحله ${level} شروع شد! زامبی‌های پیش‌رو: ${totalZombies}`);

            for (let z = 1; z <= totalZombies; z++) {
                if (castleHp <= 0) break;

                let isBoss = (z === totalZombies && level % 5 === 0);
                zombieIcon.innerText = isBoss ? '👹' : '🧟';

                let zMaxHp = isBoss ? (200 + level * 50) : (50 + (level * 20));
                activeZombieHp = zMaxHp;
                let baseDmg = isBoss ? (25 + level * 5) : (10 + level * 4);

                // Zombie Approach
                zombieSprite.style.left = '70px';
                zombieHpBar.style.width = '100%';
                log(isBoss ? `👹 غول زامبی وارد میدان شد!` : `🧟 زامبی شماره ${z} نزدیک می‌شود.`);
                await new Promise(r => setTimeout(r, 600));

                while (activeZombieHp > 0 && castleHp > 0) {
                    if (soldiers.length === 0) {
                        // Zombie Attacks Castle
                        zombieSprite.classList.add('attack-effect');
                        castleSprite.classList.add('hit-effect');
                        let dmg = Math.floor(Math.random() * 8) + baseDmg;
                        castleHp = Math.max(0, castleHp - dmg);
                        log(`💥 زامبی به قلعه ضربه زد! (-${dmg} HP)`);
                        updateUI();

                        await new Promise(r => setTimeout(r, 500));
                        zombieSprite.classList.remove('attack-effect');
                        castleSprite.classList.remove('hit-effect');
                        break;
                    } else {
                        // Soldiers Attack Zombie
                        let totalDmg = soldiers.reduce((acc, s) => acc + s.damage, 0);
                        activeZombieHp = Math.max(0, activeZombieHp - totalDmg);
                        zombieHpBar.style.width = `${Math.max(0, (activeZombieHp / zMaxHp) * 100)}%`;
                        
                        soldiersArea.classList.add('attack-effect');
                        zombieSprite.classList.add('hit-effect');
                        log(`⚔️ سربازها حمله کردند! (${totalDmg} آسیب)`);

                        await new Promise(r => setTimeout(r, 500));
                        soldiersArea.classList.remove('attack-effect');
                        zombieSprite.classList.remove('hit-effect');

                        if (activeZombieHp <= 0) {
                            let reward = isBoss ? 30 : (Math.floor(Math.random() * 4) + 3);
                            coins += reward;
                            log(`🎉 زامبی نابود شد! +${reward} سکه.`);
                            zombieSprite.style.left = '-80px';
                            updateUI();
                            await new Promise(r => setTimeout(r, 400));
                            break;
                        }

                        // Zombie Counter-Attacks Soldier
                        let targetIdx = Math.floor(Math.random() * soldiers.length);
                        let target = soldiers[targetIdx];
                        let dmg = Math.floor(Math.random() * 6) + baseDmg;
                        target.hp = Math.max(0, target.hp - dmg);
                        
                        zombieSprite.classList.add('attack-effect');
                        log(`🧟 زامبی حمله کرد! سرباز ${targetIdx + 1} آسیب دید (-${dmg} HP)`);

                        await new Promise(r => setTimeout(r, 500));
                        zombieSprite.classList.remove('attack-effect');

                        if (target.hp <= 0) {
                            log(`💀 سرباز شماره ${targetIdx + 1} از پا درآمد!`);
                            soldiers.splice(targetIdx, 1);
                        }
                        updateUI();
                        await new Promise(r => setTimeout(r, 400));
                    }
                }
            }

            activeZombieHp = 0;

            if (castleHp <= 0) {
                log("💥 قلعه سقوط کرد! بازی بازنشانی می‌شود.");
                alert("💔 باختی! قلعه سقوط کرد.");
                coins = 25; soldiers = []; upgradeLevel = 0; level = 1; maxCastleHp = 120; castleHp = maxCastleHp;
            } else {
                log(`🎉 مرحله ${level} فتح شد! +40 سکه پاداش.`);
                coins += 40;
                level++;
                maxCastleHp += 20;
                castleHp = maxCastleHp; // Full Heal Castle on Level Up
            }

            zombieSprite.style.left = '-80px';
            isFighting = false;
            updateUI();
        }
    </script>
</body>
</html>
