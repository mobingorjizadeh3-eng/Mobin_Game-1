<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBIN GAME BETA 0.4.2 - GRAPHICAL EDITION</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
            width: 100%;
            max-width: 750px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 { color: #38bdf8; margin-bottom: 5px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }

        /* Game Canvas Container */
        #canvas-container {
            position: relative;
            width: 100%;
            height: 320px;
            background: linear-gradient(to bottom, #1e1b4b, #311b92 60%, #15803d 60%, #166534 100%);
            border-radius: 12px;
            border: 2px solid #475569;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* Top HUD */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            font-weight: bold;
        }

        .hud span { display: flex; align-items: center; gap: 5px; }

        /* Control Panel / Buttons */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 10px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:hover:not(:disabled) { background: #1d4ed8; transform: translateY(-2px); }
        .btn:disabled { background: #475569; opacity: 0.6; cursor: not-allowed; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover:not(:disabled) { background: #b91c1c; }
        .btn-success { background: #16a34a; }
        .btn-success:hover:not(:disabled) { background: #15803d; }

        /* Message Log */
        #log-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            height: 80px;
            overflow-y: auto;
            font-size: 0.85rem;
            text-align: right;
            color: #38bdf8;
            margin-top: 12px;
        }

        /* Elements inside Canvas */
        .sprite {
            position: absolute;
            bottom: 60px;
            font-size: 45px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hp-bar-outer {
            width: 40px;
            height: 6px;
            background: #475569;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .hp-bar-inner {
            height: 100%;
            background: #22c55e;
            width: 100%;
            transition: width 0.2s;
        }

        .hit-effect {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🏰 MOBIN GAME</h1>
        <p class="subtitle">نسخه گرافیکی اختصاصی (Graphic Beta 0.4.2)</p>

        <!-- HUD Status -->
        <div class="hud">
            <span>👤 <span id="p-name">بازیکن</span></span>
            <span>🎯 مرحله: <span id="lvl-txt">1</span></span>
            <span>💰 سکه: <span id="coin-txt">20</span></span>
            <span>🏰 قلعه: <span id="castle-hp">100</span>/100</span>
        </div>

        <!-- Visual Canvas Arena -->
        <div id="canvas-container">
            <!-- Castle -->
            <div class="sprite" style="right: 20px; bottom: 50px;" id="castle-sprite">
                <div class="hp-bar-outer"><div class="hp-bar-inner" id="castle-hp-bar"></div></div>
                🏰
            </div>

            <!-- Soldiers Container -->
            <div id="soldiers-area" style="position: absolute; right: 100px; bottom: 55px; display: flex; gap: 8px;"></div>

            <!-- Zombie Sprite -->
            <div class="sprite" id="zombie-sprite" style="left: -80px; bottom: 55px;">
                <div class="hp-bar-outer"><div class="hp-bar-inner" id="zombie-hp-bar"></div></div>
                🧟
            </div>
        </div>

        <!-- Log Info -->
        <div id="log-box">به بازی مبین گیم خوش آمدید! برای شروع از فروشگاه سرباز بگیرید یا نبرد رو شروع کنید.</div>

        <!-- Buttons Controls -->
        <div class="controls">
            <button class="btn" id="btn-buy" onclick="buySoldier()">🪖 خرید سرباز (10💰)</button>
            <button class="btn" id="btn-up1" onclick="upgrade1()">⬆️ ارتقا ۱ (16💰)</button>
            <button class="btn" id="btn-up3" onclick="upgrade3()">🔥 ارتقا ۳ (40💰)</button>
            <button class="btn btn-danger" id="btn-fight" onclick="startBattle()">⚔️ شروع نبرد</button>
        </div>
    </div>

    <script>
        // --- GAME VARIABLES ---
        let coins = 20;
        let level = 1;
        let castleHp = 100;
        let maxCastleHp = 100;
        let upgradeLevel = 0;
        let soldiers = [];
        let isFighting = false;

        // --- DOM ELEMENTS ---
        const coinTxt = document.getElementById('coin-txt');
        const lvlTxt = document.getElementById('lvl-txt');
        const castleHpTxt = document.getElementById('castle-hp');
        const castleHpBar = document.getElementById('castle-hp-bar');
        const logBox = document.getElementById('log-box');
        const soldiersArea = document.getElementById('soldiers-area');
        const zombieSprite = document.getElementById('zombie-sprite');
        const zombieHpBar = document.getElementById('zombie-hp-bar');
        const castleSprite = document.getElementById('castle-sprite');

        function log(msg) {
            logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
        }

        function updateUI() {
            coinTxt.innerText = coins;
            lvlTxt.innerText = level;
            castleHpTxt.innerText = castleHp;
            castleHpBar.style.width = `${(castleHp / maxCastleHp) * 100}%`;

            // Update Soldiers Render
            soldiersArea.innerHTML = '';
            soldiers.forEach((s, i) => {
                const sEl = document.createElement('div');
                sEl.className = 'sprite';
                sEl.style.position = 'relative';
                sEl.style.bottom = '0';
                sEl.innerHTML = `
                    <div class="hp-bar-outer"><div class="hp-bar-inner" style="width:${(s.hp/s.max_hp)*100}%"></div></div>
                    🪖
                `;
                soldiersArea.appendChild(sEl);
            });

            // Disable buttons if fighting
            document.getElementById('btn-buy').disabled = isFighting || coins < 10;
            document.getElementById('btn-up1').disabled = isFighting || upgradeLevel >= 1 || coins < 16 || soldiers.length === 0;
            document.getElementById('btn-up3').disabled = isFighting || upgradeLevel !== 1 || coins < 40;
            document.getElementById('btn-fight').disabled = isFighting;
        }

        function buySoldier() {
            if (coins >= 10) {
                coins -= 10;
                let dmg = 12 + (upgradeLevel >= 1 ? 8 : 0) + (upgradeLevel >= 3 ? 20 : 0);
                let mhp = 100 + (upgradeLevel >= 1 ? 20 : 0) + (upgradeLevel >= 3 ? 40 : 0);
                soldiers.push({ hp: mhp, max_hp: mhp, damage: dmg });
                log(`یک سرباز جدید خریداری شد! (تعداد کل: ${soldiers.length})`);
                updateUI();
            }
        }

        function upgrade1() {
            if (coins >= 16 && upgradeLevel === 0 && soldiers.length > 0) {
                coins -= 16;
                upgradeLevel = 1;
                soldiers.forEach(s => { s.damage += 8; s.max_hp += 20; s.hp += 20; });
                log("ارتقا سطح ۱ فعال شد! قدرد سربازان افزایش یافت.");
                updateUI();
            }
        }

        function upgrade3() {
            if (coins >= 40 && upgradeLevel === 1) {
                coins -= 40;
                upgradeLevel = 3;
                soldiers.forEach(s => { s.damage += 20; s.max_hp += 40; s.hp += 40; });
                log("ارتقا سطح ۳ فعال شد! سربازان پرقدرت شدند 🔥");
                updateUI();
            }
        }

        async function startBattle() {
            isFighting = true;
            updateUI();

            let totalZombies = 5 + ((level - 1) * 3);
            log(`⚔️ نبرد مرحله ${level} شروع شد! تعداد زامبی‌ها: ${totalZombies}`);

            for (let z = 1; z <= totalZombies; z++) {
                if (castleHp <= 0) break;

                let zMaxHp = 60 + ((level - 1) * 25);
                let zHp = zMaxHp;
                let baseDmg = 12 + ((level - 1) * 6);

                // Move Zombie In
                zombieSprite.style.left = '80px';
                zombieHpBar.style.width = '100%';
                log(`🧟 زامبی شماره ${z} وارد میدان شد!`);
                await new Promise(r => setTimeout(r, 800));

                while (zHp > 0 && castleHp > 0) {
                    // 1. Attack Phase (Soldiers vs Zombie)
                    if (soldiers.length === 0) {
                        // Zombie hits Castle
                        zombieSprite.classList.add('hit-effect');
                        castleSprite.classList.add('hit-effect');
                        let dmg = Math.floor(Math.random() * 11) + 15;
                        castleHp = Math.max(0, castleHp - dmg);
                        log(`💥 هیچ سربازی نیست! زامبی به قلعه ضربه زد (-${dmg} HP)`);
                        updateUI();
                        await new Promise(r => setTimeout(r, 600));
                        zombieSprite.classList.remove('hit-effect');
                        castleSprite.classList.remove('hit-effect');
                        break;
                    } else {
                        // Soldiers Hit Zombie
                        let totalDmg = soldiers.reduce((acc, s) => acc + s.damage, 0);
                        zHp = Math.max(0, zHp - totalDmg);
                        zombieHpBar.style.width = `${(zHp / zMaxHp) * 100}%`;
                        zombieSprite.classList.add('hit-effect');
                        log(`⚔️ سربازها حمله کردند! (${totalDmg} آسیب به زامبی)`);
                        await new Promise(r => setTimeout(r, 600));
                        zombieSprite.classList.remove('hit-effect');

                        if (zHp <= 0) {
                            let reward = Math.floor(Math.random() * 4) + 2;
                            coins += reward;
                            log(`🎉 زامبی نابود شد! +${reward} سکه پاداش گرفتی.`);
                            zombieSprite.style.left = '-80px';
                            updateUI();
                            await new Promise(r => setTimeout(r, 600));
                            break;
                        }

                        // Zombie Retaliates
                        let targetIdx = Math.floor(Math.random() * soldiers.length);
                        let target = soldiers[targetIdx];
                        let dmg = Math.floor(Math.random() * 9) + (baseDmg - 4);
                        target.hp = Math.max(0, target.hp - dmg);
                        log(`🧟 زامبی پاتک زد! به سرباز ${targetIdx + 1} آسیب وارد شد (-${dmg} HP)`);

                        if (target.hp <= 0) {
                            log(`💀 سرباز شماره ${targetIdx + 1} کشته شد!`);
                            soldiers.splice(targetIdx, 1);
                        }
                        updateUI();
                        await new Promise(r => setTimeout(r, 600));
                    }
                }
            }

            if (castleHp <= 0) {
                log("💥 قلعه سقوط کرد! بازی بازنشانی شد.");
                alert("شما باختید! بازی از مرحله ۱ شروع می‌شود.");
                coins = 20; soldiers = []; upgradeLevel = 0; level = 1; castleHp = maxCastleHp;
            } else {
                log(`🎉 مرحله ${level} با موفقیت تمام شد! +50 سکه پاداش.`);
                coins += 50;
                level++;
                castleHp = maxCastleHp;
                if (level > 3) {
                    alert("🏆 تبریک! شما تمام مراحل Mobin Game را با موفقیت تمام کردید!");
                    level = 1;
                }
            }

            zombieSprite.style.left = '-80px';
            isFighting = false;
            updateUI();
        }

        // Init
        updateUI();
    </script>
</body>
</html>
