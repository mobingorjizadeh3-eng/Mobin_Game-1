<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOBIN GAME - CASTLE SIEGE EDITION</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        /* --- MAIN MENU (LOBBY - UNTOUCHED) --- */
        #main-menu {
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid #38bdf8;
            border-radius: 20px;
            padding: 35px 25px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.2);
            animation: fadeIn 0.4s ease-out;
        }

        h1 {
            font-size: 2.2rem;
            color: #38bdf8;
            margin-bottom: 8px;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
        }

        p.subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
        .menu-btn-group { display: flex; flex-direction: column; gap: 12px; }

        /* --- GAME VIEW --- */
        #game-view {
            display: none;
            width: 100%;
            max-width: 800px;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease-out;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* Top HUD */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            border: 1px solid #334155;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .hud span { display: flex; align-items: center; gap: 6px; }

        /* Canvas Arena */
        #gameCanvas {
            width: 100%;
            height: 360px;
            background: #111827;
            border-radius: 12px;
            border: 2px solid #475569;
            display: block;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Control Panel */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 8px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn:hover:not(:disabled) { background: #1d4ed8; transform: translateY(-2px); }
        .btn:disabled { background: #334155; color: #64748b; opacity: 0.6; cursor: not-allowed; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover:not(:disabled) { background: #b91c1c; }
        .btn-fire { background: #d97706; }
        .btn-fire:hover:not(:disabled) { background: #b45309; }
        .btn-secondary { background: #334155; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- ================= MAIN MENU (LOBBY) ================= -->
    <div id="main-menu">
        <h1>🏰 MOBIN GAME</h1>
        <p class="subtitle">نسخه نبرد قلعه (GRAPHIC ENGINE V2)</p>

        <div class="menu-btn-group">
            <button class="btn" onclick="startGameView()">🎮 شروع بازی</button>
            <button class="btn btn-secondary" onclick="alert('📜 راهنما:\n\n1. کماندار و سرباز استخدام کنید.\n2. با کلیک روی گلوله آتشین زامبی‌ها را خاکستر کنید!\n3. جلوی زامبی‌های غول‌پیکر را بگیرید تا قلعه سقوط نکند.')">📜 راهنمای بازی</button>
            <button class="btn btn-secondary" onclick="alert('ℹ️ درباره بازی:\nطراحی و توسعه توسط: مبین گرجی‌زاده\nموتور گرافیکی Canvas 2D')">ℹ️ درباره سازنده</button>
        </div>
    </div>

    <!-- ================= GAME PLAY VIEW ================= -->
    <div id="game-view">
        <div class="card">
            <!-- HUD Status -->
            <div class="hud">
                <span>🎯 موج: <span id="wave-txt" style="color:#38bdf8;">1</span></span>
                <span>💰 طلا: <span id="coin-txt" style="color:#facc15;">100</span></span>
                <span>💧 مانا: <span id="mana-txt" style="color:#60a5fa;">100</span>/100</span>
                <span>🏰 قلعه: <span id="castle-hp" style="color:#4ade80;">500</span>/500</span>
                <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="returnToMenu()">🏠 منو</button>
            </div>

            <!-- HTML5 Graphics Canvas -->
            <canvas id="gameCanvas" width="750" height="360"></canvas>

            <!-- Control Buttons -->
            <div class="controls">
                <button class="btn" id="btn-archer" onclick="buyArcher()">🏹 کماندار دیوار (30💰)</button>
                <button class="btn" id="btn-knight" onclick="buyKnight()">🗡️ پیاده‌نظام (40💰)</button>
                <button class="btn btn-fire" id="btn-fireball" onclick="castFireball()">🔥 گلوله آتشین (50💧)</button>
                <button class="btn btn-danger" id="btn-wave" onclick="startNextWave()">⚔️ شروع موج بعدی</button>
            </div>
        </div>
    </div>

    <script>
        // --- GAME VARIABLES ---
        let gold = 100;
        let mana = 100;
        let wave = 1;
        let castleHp = 500;
        let maxCastleHp = 500;
        let inBattle = false;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Entities Arrays
        let archers = [{ x: 620, y: 110 }, { x: 670, y: 110 }];
        let knights = [];
        let zombies = [];
        let arrows = [];
        let fireballs = [];
        let particles = [];
        let floatingTexts = [];

        function startGameView() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-view').style.display = 'flex';
            requestAnimationFrame(gameLoop);
            updateUI();
        }

        function returnToMenu() {
            location.reload();
        }

        function updateUI() {
            document.getElementById('coin-txt').innerText = gold;
            document.getElementById('mana-txt').innerText = Math.floor(mana);
            document.getElementById('wave-txt').innerText = wave;
            document.getElementById('castle-hp').innerText = Math.max(0, castleHp);

            document.getElementById('btn-archer').disabled = gold < 30 || archers.length >= 6;
            document.getElementById('btn-knight').disabled = gold < 40;
            document.getElementById('btn-fireball').disabled = mana < 50;
            document.getElementById('btn-wave').disabled = inBattle;
        }

        function buyArcher() {
            if (gold >= 30 && archers.length < 6) {
                gold -= 30;
                let offset = archers.length * 18;
                archers.push({ x: 600 + (offset % 60), y: 110 + (offset > 60 ? 30 : 0) });
                addFloatingText(620, 100, "+1 کماندار!", "#38bdf8");
                updateUI();
            }
        }

        function buyKnight() {
            if (gold >= 40) {
                gold -= 40;
                knights.push({ x: 520 - (knights.length * 15), y: 270, hp: 120, maxHp: 120, damage: 18 });
                addFloatingText(520, 250, "+1 سرباز!", "#4ade80");
                updateUI();
            }
        }

        function castFireball() {
            if (mana >= 50) {
                mana -= 50;
                fireballs.push({
                    x: 650, y: 100,
                    targetX: 250 + Math.random() * 200, targetY: 280,
                    speed: 8
                });
                updateUI();
            }
        }

        function startNextWave() {
            inBattle = true;
            let count = 5 + wave * 3;
            let spawned = 0;

            let interval = setInterval(() => {
                let isGiant = (spawned > 0 && spawned % 5 === 0);
                let isRunner = (!isGiant && Math.random() > 0.6);

                zombies.push({
                    x: -30 - (Math.random() * 40),
                    y: 270,
                    hp: isGiant ? 250 + (wave * 50) : (isRunner ? 40 : 80 + (wave * 15)),
                    maxHp: isGiant ? 250 + (wave * 50) : (isRunner ? 40 : 80 + (wave * 15)),
                    speed: isGiant ? 0.4 : (isRunner ? 1.2 : 0.7),
                    damage: isGiant ? 35 : (isRunner ? 8 : 15),
                    type: isGiant ? 'boss' : (isRunner ? 'fast' : 'normal'),
                    size: isGiant ? 42 : 28
                });

                spawned++;
                if (spawned >= count) clearInterval(interval);
            }, 1200);

            updateUI();
        }

        function addFloatingText(x, y, text, color) {
            floatingTexts.push({ x, y, text, color, alpha: 1, vy: -1 });
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 25; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    color: Math.random() > 0.5 ? '#f97316' : '#eab308',
                    size: Math.random() * 5 + 2,
                    life: 1
                });
            }
        }

        // --- GAME LOOP & RENDERING ---
        let lastShoot = 0;

        function gameLoop(timestamp) {
            // Mana Regen
            if (mana < 100) { mana = Math.min(100, mana + 0.05); updateUI(); }

            // Clear Screen
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Sky & Mountains Background
            ctx.fillStyle = '#1e1b4b';
            ctx.fillRect(0, 0, canvas.width, 220);
            ctx.fillStyle = '#15803d'; // Grass Ground
            ctx.fillRect(0, 220, canvas.width, 140);

            // Draw Dirt Path
            ctx.fillStyle = '#78350f';
            ctx.fillRect(0, 260, canvas.width, 50);

            // Draw Castle (Right Side)
            ctx.fillStyle = '#475569';
            ctx.fillRect(580, 100, 170, 180); // Main Wall
            ctx.fillRect(560, 60, 50, 220);  // Left Tower
            ctx.fillRect(700, 60, 50, 220);  // Right Tower
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(630, 220, 40, 60);  // Gate

            // Draw Archers on Castle
            archers.forEach(a => {
                ctx.font = '20px sans-serif';
                ctx.fillText('🏹', a.x, a.y);
            });

            // Automatic Shooting from Archers
            if (timestamp - lastShoot > 1000 && zombies.length > 0) {
                lastShoot = timestamp;
                let target = zombies[0];
                archers.forEach(a => {
                    arrows.push({ x: a.x, y: a.y, targetX: target.x, targetY: target.y, speed: 7 });
                });
            }

            // Update & Draw Arrows
            for (let i = arrows.length - 1; i >= 0; i--) {
                let arr = arrows[i];
                let dx = arr.targetX - arr.x;
                let dy = arr.targetY - arr.y;
                let dist = Math.hypot(dx, dy);

                if (dist < 10 || arr.x < 0) {
                    if (zombies.length > 0) {
                        let z = zombies[0];
                        let dmg = 15;
                        z.hp -= dmg;
                        addFloatingText(z.x, z.y - 15, `-${dmg}`, '#ef4444');
                        if (z.hp <= 0) {
                            gold += z.type === 'boss' ? 30 : 8;
                            zombies.shift();
                        }
                    }
                    arrows.splice(i, 1);
                    updateUI();
                } else {
                    arr.x += (dx / dist) * arr.speed;
                    arr.y += (dy / dist) * arr.speed;
                    ctx.strokeStyle = '#fde047';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(arr.x, arr.y);
                    ctx.lineTo(arr.x - (dx / dist) * 8, arr.y - (dy / dist) * 8);
                    ctx.stroke();
                }
            }

            // Update & Draw Fireballs
            for (let i = fireballs.length - 1; i >= 0; i--) {
                let fb = fireballs[i];
                let dx = fb.targetX - fb.x;
                let dy = fb.targetY - fb.y;
                let dist = Math.hypot(dx, dy);

                if (dist < 10) {
                    createExplosion(fb.targetX, fb.targetY);
                    zombies.forEach((z, zIdx) => {
                        let zDist = Math.abs(z.x - fb.targetX);
                        if (zDist < 100) {
                            let dmg = 75;
                            z.hp -= dmg;
                            addFloatingText(z.x, z.y - 20, `-${dmg} CRIT!`, '#f97316');
                        }
                    });
                    zombies = zombies.filter(z => z.hp > 0);
                    fireballs.splice(i, 1);
                    updateUI();
                } else {
                    fb.x += (dx / dist) * fb.speed;
                    fb.y += (dy / dist) * fb.speed;
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(fb.x, fb.y, 12, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Draw & Move Knights
            knights.forEach(k => {
                ctx.font = '26px sans-serif';
                ctx.fillText('🗡️', k.x, k.y);
                // HP Bar
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(k.x, k.y - 30, 30, 4);
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(k.x, k.y - 30, (k.hp / k.maxHp) * 30, 4);
            });

            // Draw & Move Zombies
            for (let i = zombies.length - 1; i >= 0; i--) {
                let z = zombies[i];

                // Check collision with Knights
                let fightingKnight = knights.find(k => Math.abs(k.x - z.x) < 20);

                if (fightingKnight) {
                    fightingKnight.hp -= 0.2;
                    z.hp -= 0.3;
                    if (fightingKnight.hp <= 0) knights = knights.filter(k => k !== fightingKnight);
                } else if (z.x < 560) {
                    z.x += z.speed;
                } else {
                    // Attack Castle
                    castleHp -= z.damage * 0.02;
                    addFloatingText(570, 220, `-${Math.ceil(z.damage * 0.02)}`, '#dc2626');
                    updateUI();
                }

                // Render Zombie
                ctx.font = `${z.size}px sans-serif`;
                ctx.fillText(z.type === 'boss' ? '👹' : '🧟', z.x, z.y);

                // HP Bar
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(z.x, z.y - z.size, z.size, 5);
                ctx.fillStyle = z.type === 'boss' ? '#a855f7' : '#ef4444';
                ctx.fillRect(z.x, z.y - z.size, (z.hp / z.maxHp) * z.size, 5);
            }

            // Wave Clear / Lose Check
            if (inBattle && zombies.length === 0) {
                inBattle = false;
                gold += 50 + wave * 10;
                wave++;
                addFloatingText(300, 150, `موج با موفقیت دفع شد! +${50 + wave * 10} طلا`, '#facc15');
                updateUI();
            }

            if (castleHp <= 0) {
                alert("💔 قلعه شما سقوط کرد!");
                returnToMenu();
                return;
            }

            // Draw Particles
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                if (p.life <= 0) particles.splice(index, 1);
            });

            // Draw Floating Damage Texts
            floatingTexts.forEach((ft, index) => {
                ft.y += ft.vy;
                ft.alpha -= 0.02;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 14px sans-serif';
                ctx.fillText(ft.text, ft.x, ft.y);
                if (ft.alpha <= 0) floatingTexts.splice(index, 1);
            });

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
